# HVAC Bench editorial gate.
#
# Vale (https://github.com/vale-cli/vale, MIT) runs over prose extracted from
# the content model by scripts/extract-prose.ts, not over the TypeScript files
# themselves, so identifiers, imports, and Tailwind classes never reach the
# linter and every alert points at something a reader would actually see.
#
# Third-party styles are vendored under styles/ rather than synced at lint
# time, so the gate gives the same answer offline and in CI. Refresh them with
# `npm run lint:prose -- --sync`.

StylesPath = styles
MinAlertLevel = warning
Packages = write-good, proselint, Readability

Vocab = HVACBench

[*.md]
BasedOnStyles = HVACBench, write-good, proselint

# --- write-good, tuned for technical reference writing ----------------------
# E-Prime bans the verb "to be", which is unusable in a glossary that exists to
# say what things are. Passive voice is correct in procedure text where the
# actor is the equipment ("the code is cleared"), so it stays off.
write-good.E-Prime = NO
write-good.Passive = NO
write-good.So = NO
# Vale's Weasel list mixes two different problems. Words that assert a size or
# an obviousness without measuring it are handled by HVACBench.VagueQuantifier
# below; words that are simply small plurals ("several heads", "several parts")
# are the plainest available term for what they describe and are left alone.
write-good.Weasel = NO
# "purchase", "maximum", "requirement", and "therefore" are the right words in
# equipment writing. The rule optimises for a register this publication is not
# written in, so it stays off.
write-good.TooWordy = NO
write-good.Illusions = error
write-good.ThereIs = warning

# Vale's rule fires on a comparative ("more certain") and on standard HVAC
# vocabulary ("oversized", "undersized"), which are the plainest words available
# for what they describe.
proselint.Needless = NO
proselint.Uncomparables = NO
write-good.Cliches = error

# --- proselint, tuned the same way ------------------------------------------
# Hedging fires on "may", "can", and "appears to", which are the words that keep
# a mechanism claim from becoming a prevalence claim. Evidence discipline beats
# confident phrasing here, so the rule is off by design.
proselint.Hedging = NO
proselint.Annotations = error
proselint.Cliches = error
proselint.Very = error
proselint.Nonwords = error
proselint.Hyperbole = error
proselint.CorporateSpeak = error
proselint.Jargon = warning
proselint.RASSyndrome = error
proselint.Typography = NO
proselint.Spelling = NO
proselint.DateCase = NO
proselint.GroupTerms = NO
proselint.AnimalLabels = NO
proselint.DenizenLabels = NO

# --- HVAC Bench house rules -------------------------------------------------
HVACBench.BannedPhrases = error
HVACBench.TemplateLeak = error
HVACBench.Dashes = error
HVACBench.Prevalence = error
HVACBench.SentenceLength = warning
HVACBench.VagueQuantifier = error
HVACBench.SoftFrequency = warning

